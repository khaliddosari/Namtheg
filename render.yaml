# Render Deployment Blueprint for Namtheg (AutoML)
#
# BACKEND ONLY. The Next.js frontend lives on Vercel — see Docs/DEPLOYMENT.md.
#
# Why the split: Render's 750 free instance-hours are pooled PER WORKSPACE, not per
# service. Two always-on free web services burn ~1,460 h/month against that 750 h
# pool, so the quota ran dry around day 15 and Render suspended EVERY free service
# in the workspace until the 1st. That was the recurring mid-month outage.
#
# With the frontend on Vercel (which does not meter always-on instance hours), this
# one service uses at most ~744 h in a 31-day month — under the cap, all month.
#
# Do NOT add a second `plan: free` service to this file. It reintroduces the outage.
services:
  # -------------------------------------------------------------
  # FastAPI Backend Service
  # -------------------------------------------------------------
  - type: web
    name: modelforge-backend
    env: python
    plan: free
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # By default, Render Free Tier has ephemeral storage.
    # If using a paid tier ($7/mo Starter), you can uncomment the disk section below:
    # disk:
    #   name: modelforge-storage
    #   mountPath: /storage
    #   sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      # Primary LLM (GPT-6 Sol on OpenAI). DeepSeek via OpenRouter is the fallback.
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_PRIMARY_MODEL
        value: gpt-6-sol
      - key: SANDBOX_BACKEND
        value: modal
      - key: OPENROUTER_API_KEY
        sync: false # Securely prompted during Render setup
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-v4-flash
      # Attribution header sent to OpenRouter. Set this PER ACCOUNT in the Render
      # dashboard to your Vercel frontend URL, e.g. https://namtheg.vercel.app.
      - key: OPENROUTER_REFERER
        sync: false
      - key: OPENROUTER_APP_TITLE
        value: Namtheg
      - key: STORAGE_DIR
        value: ./storage
      - key: LOG_LEVEL
        value: INFO
      - key: MODAL_WORKSPACE
        sync: false # Securely prompted (e.g., your-username)
      - key: MODAL_INFERENCE_APP
        value: modelforge-inference
      - key: MODAL_MODELS_VOLUME
        value: modelforge-models
      # Token authentication details for Modal deployments inside Render:
      - key: MODAL_TOKEN_ID
        sync: false
      - key: MODAL_TOKEN_SECRET
        sync: false
